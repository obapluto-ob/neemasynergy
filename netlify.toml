[build]
  publish = "."
  functions = "netlify/functions"

# ---- FAVICON ----
[[redirects]]
  from   = "/favicon.ico"
  to     = "/images/logo.jpg"
  status = 200

# ---- API ROUTES ----
[[redirects]]
  from   = "/admin/api/login"
  to     = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from   = "/admin/api/change-password"
  to     = "/.netlify/functions/change-password"
  status = 200

[[redirects]]
  from   = "/api/visitors"
  to     = "/.netlify/functions/visitors"
  status = 200

[[redirects]]
  from   = "/admin/api/visitors"
  to     = "/.netlify/functions/visitors"
  status = 200

[[redirects]]
  from   = "/admin/api/upload"
  to     = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from   = "/admin/api/image/*"
  to     = "/.netlify/functions/delete-image"
  status = 200

[[redirects]]
  from   = "/admin/api/images"
  to     = "/.netlify/functions/images"
  status = 200

[[redirects]]
  from   = "/admin/api/settings"
  to     = "/.netlify/functions/settings"
  status = 200

[[redirects]]
  from   = "/api/settings"
  to     = "/.netlify/functions/settings"
  status = 200

# ---- PAGE ROUTES ----
[[redirects]]
  from = "/pages/about"
  to   = "/pages/about.html"
  status = 200

[[redirects]]
  from = "/pages/services"
  to   = "/pages/services.html"
  status = 200

[[redirects]]
  from = "/pages/portfolio"
  to   = "/pages/portfolio.html"
  status = 200

[[redirects]]
  from = "/pages/contact"
  to   = "/pages/contact.html"
  status = 200

[[redirects]]
  from = "/about"
  to   = "/pages/about.html"
  status = 200

[[redirects]]
  from = "/services"
  to   = "/pages/services.html"
  status = 200

[[redirects]]
  from = "/portfolio"
  to   = "/pages/portfolio.html"
  status = 200

[[redirects]]
  from = "/contact"
  to   = "/pages/contact.html"
  status = 200
